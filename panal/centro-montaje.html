<!doctype html><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Centro de Montaje</title>
<style>
  /* Tablero de operación de Panal: clientes, servicios contratados, estado de montaje e ingresos.
     Single-dark (tema Panal, miel). Layout: KPIs arriba + filtro + lista de clientes; ficha en modal. */
  :root{
    color-scheme: dark;
    --ground:#100b06; --surface:#19110a; --surface-2:#241a10; --line:#3c2d1a;
    --honey:#f6a821; --bright:#ffce6a; --deep:#a8680f; --cream:#f4ecd8; --muted:#a99a7c; --teal:#5fd0c0;
    --s-vendido:#ffce6a; --s-datos:#6ab0f2; --s-montaje:#ffb24d; --s-entregado:#5fd0c0; --s-activo:#5fd0a6;
    --glow: rgba(246,168,33,.4);
    --mono: ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --gut-l: max(16px, env(safe-area-inset-left,0px));
    --gut-r: max(16px, env(safe-area-inset-right,0px));
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground); color:var(--cream); font-family:var(--sans); line-height:1.5; padding-bottom:28px;
    background-image:radial-gradient(1100px 440px at 85% -12%, rgba(246,168,33,.1), transparent 60%)}
  img{max-width:100%} [hidden]{display:none!important}
  .wrap{max-width:1000px; margin:0 auto; padding-left:var(--gut-l); padding-right:var(--gut-r)}
  h1,h2,h3{margin:0; text-wrap:balance}
  .tab{font-variant-numeric:tabular-nums}
  button,input,select,textarea{font-family:inherit}

  header.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:rgba(16,11,6,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:21; background:var(--ground)}
  header .in{max-width:1000px; margin:0 auto; padding:11px var(--gut-r) 11px var(--gut-l); display:flex; align-items:center; justify-content:space-between; gap:10px}
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand svg{width:26px; height:29px; filter:drop-shadow(0 0 8px var(--glow)); flex:none}
  .brand b{font-weight:800; font-size:1.05rem; white-space:nowrap} .brand small{display:block; font-size:.68rem; color:var(--muted)}
  .hbtns{display:flex; gap:6px}
  .btn{border:0; border-radius:11px; font-weight:800; padding:10px 13px; font-size:.84rem; cursor:pointer; font-family:var(--sans); text-align:center}
  .btn-h{background:linear-gradient(180deg,var(--bright),var(--honey)); color:#2a1a05}
  .btn-g{background:var(--surface-2); color:var(--cream); border:1px solid var(--line)}
  .mini{border:1px solid var(--line); background:var(--surface); color:var(--cream); border-radius:999px; padding:9px 12px; font-weight:800; font-size:.76rem; cursor:pointer}
  .mini.red{color:#f0755c; border-color:color-mix(in srgb,#f0755c 40%,var(--line))}

  section{padding-block:18px}
  .kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
  @media(max-width:820px){ .kpis{grid-template-columns:repeat(3,1fr)} }
  @media(max-width:520px){ .kpis{grid-template-columns:1fr 1fr} }
  .kpi{background:linear-gradient(180deg,var(--surface),#140d07); border:1px solid var(--line); border-radius:14px; padding:13px}
  .kpi .k{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:800}
  .kpi .v{font-size:1.5rem; font-weight:800; margin-top:5px; letter-spacing:-.01em}
  .kpi .d{font-size:.72rem; color:var(--muted); margin-top:2px}
  .kpi.wide{grid-column:span 1}
  .prog{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-top:8px}
  .prog span{display:block; height:100%; background:linear-gradient(90deg,var(--deep),var(--bright)); border-radius:999px}

  .filters{display:flex; gap:7px; overflow-x:auto; padding:14px 0 4px; scrollbar-width:none} .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px; padding:8px 14px; font-weight:800; font-size:.82rem; cursor:pointer}
  .chip.on{background:linear-gradient(180deg,var(--bright),var(--honey)); color:#2a1a05; border-color:transparent}

  .clients{display:grid; gap:10px}
  .client{display:flex; align-items:center; gap:13px; border:1px solid var(--line); border-left-width:4px; border-radius:14px; padding:13px 15px; background:linear-gradient(180deg,var(--surface),#140d07); cursor:pointer}
  .client .main{flex:1; min-width:0}
  .client .nm{font-size:1.02rem; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .client .sub{color:var(--muted); font-size:.82rem; margin-top:2px}
  .client .svc-chips{display:flex; gap:5px; flex-wrap:wrap; margin-top:7px}
  .sc{font-size:.68rem; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--cream); background:var(--surface-2)}
  .client .money{text-align:right; white-space:nowrap} .client .money b{color:var(--bright); font-weight:800} .client .money small{display:block; color:var(--muted); font-size:.74rem}
  .pill{font-size:.68rem; font-weight:800; padding:3px 9px; border-radius:999px; border:1px solid currentColor}
  .pill.Vendido{color:var(--s-vendido)} .pill.Datos{color:var(--s-datos)} .pill.Montaje{color:var(--s-montaje)} .pill.Entregado{color:var(--s-entregado)} .pill.Activo{color:var(--s-activo)}
  .client.Vendido{border-left-color:var(--s-vendido)} .client.Datos{border-left-color:var(--s-datos)} .client.Montaje{border-left-color:var(--s-montaje)} .client.Entregado{border-left-color:var(--s-entregado)} .client.Activo{border-left-color:var(--s-activo)}
  .empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:.92rem}

  /* modal */
  .modal{position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; justify-content:center; background:rgba(5,3,1,.72)}
  .modal.open{display:flex}
  @media(min-width:620px){ .modal{align-items:center; padding:20px} }
  .sheet{width:100%; max-width:560px; max-height:92vh; overflow-y:auto; background:var(--ground); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:18px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
  @media(min-width:620px){ .sheet{border-radius:20px; padding-inline:18px} }
  .sheet h2{font-size:1.1rem; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .x{border:1px solid var(--line); background:var(--surface); color:var(--cream); border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:15px}
  label.f{display:flex; flex-direction:column; gap:4px; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:10px}
  label.f input,label.f select,label.f textarea{font-size:.95rem; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--cream); font-weight:500; text-transform:none; letter-spacing:0}
  textarea{min-height:70px; resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--honey)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}@media(max-width:460px){.grid2{grid-template-columns:1fr}}
  .svcpick{display:grid; gap:7px; margin-bottom:10px}
  .svcrow{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:11px; padding:10px 12px; background:var(--surface); cursor:pointer}
  .svcrow.on{border-color:var(--honey); background:color-mix(in srgb,var(--honey) 10%,var(--surface))}
  .svcrow .ck{flex:none; width:22px; height:22px; border-radius:6px; border:2px solid var(--line); display:grid; place-items:center; font-weight:900; color:transparent}
  .svcrow.on .ck{background:var(--honey); border-color:var(--honey); color:#2a1a05}
  .svcrow .n{flex:1; min-width:0; font-size:.9rem; font-weight:700}
  .svcrow .pz{text-align:right; font-size:.76rem; color:var(--muted); white-space:nowrap} .svcrow .pz b{color:var(--bright); display:block; font-weight:800}
  .totbar{display:flex; justify-content:space-between; gap:10px; border:1px solid rgba(246,168,33,.4); border-radius:12px; padding:12px 14px; background:color-mix(in srgb,var(--honey) 9%,var(--surface)); margin-bottom:12px; font-size:.9rem}
  .totbar b{color:var(--bright); font-size:1.15rem; font-family:var(--mono)}
  .chkline{display:flex; align-items:center; gap:9px; font-size:.9rem; color:var(--cream); margin-bottom:12px} .chkline input{width:18px;height:18px;accent-color:var(--honey)}
  .acts{display:flex; gap:8px; flex-wrap:wrap} .acts .btn{flex:1; min-width:130px}
  .msg{font-size:.8rem; color:var(--s-activo); text-align:center; min-height:1.1em; margin-top:8px}
  input[type=file]{display:none}
  :focus-visible{outline:2px solid var(--bright); outline-offset:2px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd778"/><stop offset="1" stop-color="#d98a12"/></linearGradient>
  <symbol id="hex" viewBox="0 0 60 66"><path d="M30 2 56 17V49L30 64 4 49V17Z" fill="none" stroke="url(#gH)" stroke-width="3"/><path d="M30 16 44 24V40L30 48 16 40V24Z" fill="url(#gH)" opacity=".9"/><circle cx="30" cy="32" r="4.5" fill="#160f07"/></symbol>
</defs></svg>

<header class="bar"><div class="in">
  <span class="brand"><svg aria-hidden="true"><use href="#hex"/></svg><span><b>Centro de Montaje</b><small>Panal · tus clientes y servicios</small></span></span>
  <div class="hbtns">
    <button class="mini" id="btnExp">💾</button>
    <button class="mini" id="btnImp">📥</button>
    <button class="btn btn-h" id="btnNew">➕ Cliente</button>
    <input id="impFile" type="file" accept="application/json">
  </div>
</div></header>

<section class="wrap">
  <div class="kpis">
    <div class="kpi"><div class="k">Clientes</div><div class="v tab" id="kTot">0</div><div class="d" id="kMeta">meta 112</div><div class="prog"><span id="kBar" style="width:0%"></span></div></div>
    <div class="kpi"><div class="k">Por montar</div><div class="v tab" id="kPend" style="color:var(--s-montaje)">0</div><div class="d">vendidos sin entregar</div></div>
    <div class="kpi"><div class="k">Activos</div><div class="v tab" id="kAct" style="color:var(--s-activo)">0</div><div class="d">funcionando</div></div>
    <div class="kpi"><div class="k">Instalación</div><div class="v tab" id="kInst" style="color:var(--bright)">$0</div><div class="d">contratado (una vez)</div></div>
    <div class="kpi"><div class="k">Mensual</div><div class="v tab" id="kMes" style="color:var(--bright)">$0</div><div class="d">de clientes activos</div></div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="clients" id="clients"></div>
</section>

<!-- ficha cliente -->
<div class="modal" id="cliModal"><div class="sheet">
  <h2 id="cliTitle">Nuevo cliente <button class="x" id="cliX">✕</button></h2>
  <div class="grid2">
    <label class="f">Nombre del negocio<input id="fNombre" placeholder="Ej: Café Aroma"></label>
    <label class="f">Rubro<input id="fRubro" placeholder="Ej: Cafetería"></label>
    <label class="f">WhatsApp<input id="fWa" placeholder="56912345678" inputmode="tel"></label>
    <label class="f">Ciudad<input id="fCiudad" placeholder="Ej: Lota"></label>
    <label class="f">URL (su página)<input id="fUrl" placeholder="panal.cl/cafe-aroma"></label>
    <label class="f">Estado<select id="fEstado"><option>Vendido</option><option>Datos</option><option>En montaje</option><option>Entregado</option><option>Activo</option></select></label>
  </div>

  <div class="f" style="margin-bottom:6px">Servicios contratados</div>
  <div class="svcpick" id="svcPick"></div>
  <div class="totbar"><span>Instalación <b class="tab" id="fInst">$0</b></span><span style="text-align:right">Mensual <b class="tab" id="fMes">$0</b></span></div>

  <label class="chkline"><input type="checkbox" id="fAnticipo"> Anticipo pagado (50%)</label>
  <label class="f">Datos / notas para montar<textarea id="fNotas" placeholder="Logo, colores, productos, horario, link de reseña... lo que me tienes que pasar."></textarea></label>

  <div class="acts">
    <button class="btn btn-h" id="fSave">Guardar</button>
    <button class="btn btn-g" id="fResumen">📋 Resumen para montar</button>
  </div>
  <button class="mini red" id="fDel" style="margin-top:10px; display:none">🗑️ Eliminar cliente</button>
  <p class="msg" id="fMsg"></p>
</div></div>

<script>
(function(){
  "use strict";
  var LS="panal-centro-clientes";
  var SERVICIOS=[
    {id:"landing", n:"Landing page", inst:99000, mes:0},
    {id:"tienda", n:"Tienda web", inst:120000, mes:0},
    {id:"menu", n:"Menú digital QR", inst:90000, mes:15000},
    {id:"agenda", n:"Agenda de citas", inst:120000, mes:20000},
    {id:"resenas", n:"Reseñas Google", inst:70000, mes:15000},
    {id:"cotizador", n:"Cotizador de Servicios", inst:120000, mes:20000},
    {id:"sistema", n:"Sistema de gestión (Completo)", inst:1200000, mes:80000},
    {id:"ecosistema", n:"Ecosistema a medida", inst:1200000, mes:80000},
    {id:"marketing", n:"Marketing / redes", inst:0, mes:150000}
  ];
  var ESTADOS=["Vendido","Datos","En montaje","Entregado","Activo"];
  function estClass(e){ return e==="En montaje"?"Montaje":e; }

  var clientes=[]; try{ clientes=JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){ clientes=null; }
  if(clientes===null) clientes=[seed()];
  var filtro="Todos", editId=null;

  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  function money(n){ return "$"+Math.round(Number(n)||0).toLocaleString("es-CL"); }
  function save(){ try{ localStorage.setItem(LS,JSON.stringify(clientes)); }catch(e){ flash("⚠️ No se pudo guardar"); } }
  function flash(m){ $("fMsg").textContent=m; setTimeout(function(){$("fMsg").textContent="";},2600); }
  function svcById(id){ return SERVICIOS.filter(function(s){return s.id===id;})[0]; }
  function totales(ids){ var inst=0,mes=0; (ids||[]).forEach(function(id){ var s=svcById(id); if(s){inst+=s.inst;mes+=s.mes;} }); return {inst:inst,mes:mes}; }
  function seed(){ return {id:"c"+Date.now(), nombre:"Ejemplo · Café Aroma", rubro:"Cafetería", wa:"", ciudad:"Lota", url:"panal.cl/cafe-aroma", estado:"En montaje", anticipo:true, notas:"Logo listo, faltan fotos de productos.", servicios:["menu","resenas"], fecha:new Date().toISOString()}; }

  // ---- KPIs ----
  function renderKpis(){
    var n=clientes.length;
    $("kTot").textContent=n; $("kMeta").textContent="meta 112"; $("kBar").style.width=Math.min(100,n/112*100)+"%";
    $("kPend").textContent=clientes.filter(function(c){return ["Vendido","Datos","En montaje"].indexOf(c.estado)>=0;}).length;
    $("kAct").textContent=clientes.filter(function(c){return c.estado==="Activo";}).length;
    var inst=0,mes=0; clientes.forEach(function(c){ var t=totales(c.servicios); inst+=t.inst; if(c.estado==="Activo"||c.estado==="Entregado") mes+=t.mes; });
    $("kInst").textContent=money(inst); $("kMes").textContent=money(mes);
  }

  // ---- filtros ----
  function renderFilters(){
    var f=$("filters"); f.innerHTML="";
    ["Todos"].concat(ESTADOS).forEach(function(e){
      var cnt=e==="Todos"?clientes.length:clientes.filter(function(c){return c.estado===e;}).length;
      var b=document.createElement("button"); b.className="chip"+(filtro===e?" on":"");
      b.innerHTML=esc(e)+' <span style="opacity:.7">'+cnt+'</span>';
      b.onclick=function(){ filtro=e; renderFilters(); renderList(); };
      f.appendChild(b);
    });
  }

  // ---- lista ----
  function renderList(){
    var c=$("clients"); c.innerHTML="";
    var list=clientes.filter(function(x){return filtro==="Todos"||x.estado===filtro;})
      .sort(function(a,b){ return ESTADOS.indexOf(a.estado)-ESTADOS.indexOf(b.estado) || (b.fecha||"").localeCompare(a.fecha||""); });
    if(!list.length){ c.innerHTML='<div class="empty">'+(clientes.length?"No hay clientes en ese estado.":"Aún no tienes clientes. Toca ➕ Cliente para registrar el primero.")+'</div>'; return; }
    list.forEach(function(cl){
      var t=totales(cl.servicios);
      var d=document.createElement("div"); d.className="client "+estClass(cl.estado);
      d.innerHTML='<div class="main"><div class="nm">'+esc(cl.nombre||"Sin nombre")+' <span class="pill '+estClass(cl.estado)+'">'+esc(cl.estado)+'</span>'+(cl.anticipo?'':' <span class="pill" style="color:var(--muted)">sin anticipo</span>')+'</div>'
        +'<div class="sub">'+esc(cl.rubro||"—")+(cl.ciudad?' · '+esc(cl.ciudad):'')+(cl.url?' · '+esc(cl.url):'')+'</div>'
        +'<div class="svc-chips">'+(cl.servicios||[]).map(function(id){var s=svcById(id);return s?'<span class="sc">'+esc(s.n)+'</span>':'';}).join('')+'</div></div>'
        +'<div class="money"><b class="tab">'+money(t.inst)+'</b><small>'+(t.mes?money(t.mes)+'/mes':'sin mensual')+'</small></div>';
      d.onclick=function(){ openCli(cl.id); };
      c.appendChild(d);
    });
  }

  // ---- modal ----
  function openM(){ $("cliModal").classList.add("open"); } function closeM(){ $("cliModal").classList.remove("open"); }
  $("cliX").onclick=closeM; $("cliModal").addEventListener("click",function(e){ if(e.target===$("cliModal")) closeM(); });
  addEventListener("keydown",function(e){ if(e.key==="Escape") closeM(); });

  var pickSel=[];
  function renderPick(){
    var c=$("svcPick"); c.innerHTML="";
    SERVICIOS.forEach(function(s){
      var on=pickSel.indexOf(s.id)>=0;
      var d=document.createElement("div"); d.className="svcrow"+(on?" on":"");
      d.innerHTML='<div class="ck">✓</div><div class="n">'+esc(s.n)+'</div><div class="pz">'+(s.inst?money(s.inst):'—')+'<b>'+(s.mes?money(s.mes)+'/mes':'')+'</b></div>';
      d.onclick=function(){ var i=pickSel.indexOf(s.id); if(i>=0) pickSel.splice(i,1); else pickSel.push(s.id); renderPick(); pickTot(); };
      c.appendChild(d);
    });
  }
  function pickTot(){ var t=totales(pickSel); $("fInst").textContent=money(t.inst); $("fMes").textContent=money(t.mes); }

  function openCli(id){
    editId=id; var cl=id?clientes.filter(function(c){return c.id===id;})[0]:null;
    $("cliTitle").firstChild.textContent = cl?"Ficha del cliente ":"Nuevo cliente ";
    $("fNombre").value=cl?cl.nombre:""; $("fRubro").value=cl?cl.rubro:""; $("fWa").value=cl?cl.wa:""; $("fCiudad").value=cl?(cl.ciudad||""):"";
    $("fUrl").value=cl?(cl.url||""):""; $("fEstado").value=cl?cl.estado:"Vendido"; $("fAnticipo").checked=cl?!!cl.anticipo:false; $("fNotas").value=cl?(cl.notas||""):"";
    pickSel=cl?(cl.servicios||[]).slice():[]; renderPick(); pickTot();
    $("fDel").style.display=cl?"":"none";
    openM(); $("cliModal").querySelector(".sheet").scrollTop=0;
  }
  $("btnNew").onclick=function(){ openCli(null); };

  $("fSave").onclick=function(){
    var nom=$("fNombre").value.trim(); if(!nom){ $("fNombre").focus(); return; }
    var data={ nombre:nom, rubro:$("fRubro").value.trim(), wa:$("fWa").value.replace(/\D/g,''), ciudad:$("fCiudad").value.trim(),
      url:$("fUrl").value.trim(), estado:$("fEstado").value, anticipo:$("fAnticipo").checked, notas:$("fNotas").value.trim(), servicios:pickSel.slice() };
    if(editId){ var c=clientes.filter(function(x){return x.id===editId;})[0]; if(c) Object.assign(c,data); }
    else { data.id="c"+Date.now(); data.fecha=new Date().toISOString(); clientes.push(data); }
    save(); renderAll(); closeM();
  };
  $("fDel").onclick=function(){ if(editId){ clientes=clientes.filter(function(c){return c.id!==editId;}); save(); renderAll(); closeM(); } };
  $("fResumen").onclick=function(){
    var dc={ nombre:$("fNombre").value.trim(), rubro:$("fRubro").value.trim(), wa:$("fWa").value.trim(), ciudad:$("fCiudad").value.trim(), url:$("fUrl").value.trim(), estado:$("fEstado").value, notas:$("fNotas").value.trim() };
    var t=totales(pickSel);
    var x="MONTAR CLIENTE — "+(dc.nombre||"")+"\n";
    if(dc.rubro) x+="Rubro: "+dc.rubro+"\n"; if(dc.ciudad) x+="Ciudad: "+dc.ciudad+"\n"; if(dc.wa) x+="WhatsApp: "+dc.wa+"\n"; if(dc.url) x+="URL: "+dc.url+"\n";
    x+="\nSERVICIOS CONTRATADOS:\n";
    pickSel.forEach(function(id){ var s=svcById(id); if(s) x+="• "+s.n+" — "+money(s.inst)+(s.mes?(" + "+money(s.mes)+"/mes"):"")+"\n"; });
    if(!pickSel.length) x+="(ninguno marcado)\n";
    x+="\nTotal instalación: "+money(t.inst)+" · Mensual: "+money(t.mes)+"\n";
    if(dc.notas) x+="\nDATOS / NOTAS:\n"+dc.notas+"\n";
    x+="\n(Pégale esto a Claude para montarlo.)";
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(x).then(function(){flash("✅ Resumen copiado — pégalo en Claude");},function(){selCopy(x);}); } else selCopy(x);
  };
  function selCopy(t){ var a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand("copy");flash("✅ Copiado");}catch(e){flash("Copia manual");} a.remove(); }

  // ---- respaldo ----
  function dl(text,name,type){ try{ var b=new Blob([text],{type:type}); var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000); }catch(e){} }
  $("btnExp").onclick=function(){ dl(JSON.stringify(clientes,null,2),"panal-clientes-"+new Date().toISOString().slice(0,10)+".json","application/json"); };
  $("btnImp").onclick=function(){ $("impFile").click(); };
  $("impFile").onchange=function(){ var f=this.files&&this.files[0]; if(!f)return; var r=new FileReader(); r.onload=function(){ try{ var j=JSON.parse(r.result); if(Array.isArray(j)){ clientes=j; save(); renderAll(); } }catch(e){} }; r.readAsText(f); this.value=""; };

  function renderAll(){ renderKpis(); renderFilters(); renderList(); }
  renderAll();
})();
</script>
