<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Propuesta Panal</title>
<style>
  :root{
    --bg:#f3eee4; --paper:#ffffff; --ink:#20180d; --ink2:#6b5d47; --line:#e3d7c0;
    --honey:#d6821a; --honey-deep:#a8680f; --soft:#faf3e6; --good:#2f8f5b; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
  .bar{position:sticky;top:0;z-index:20;background:#20180d;color:#fff;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px}
  .bar b{font-weight:800}
  .bar .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{cursor:pointer;border:0;border-radius:999px;font-weight:800;font-size:.85rem;padding:9px 15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-h{background:linear-gradient(180deg,#ffce6a,var(--honey));color:#2a1a05}
  .btn-w{background:#25D366;color:#04220f}
  .btn-g{background:#3a2f1e;color:#f4ecd8}
  .doc{max-width:820px;margin:18px auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px);box-shadow:0 12px 40px -22px rgba(0,0,0,.4)}
  .eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--honey-deep)}
  h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:850;margin:6px 0 2px;letter-spacing:-.02em}
  .meta{color:var(--ink2);font-size:.9rem}
  .lead{margin:14px 0 0;font-size:1.02rem;color:#2c2416}
  h2{font-size:1.15rem;font-weight:850;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--soft)}
  .item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--soft)}
  .item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .item h3{font-size:1rem;font-weight:800;margin:0}
  .item .pr{font-weight:800;color:var(--honey-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
  .item .ben{color:var(--ink2);font-size:.9rem;margin:4px 0 0}
  .item .cas{color:#4a3d28;font-size:.82rem;margin:6px 0 0}
  .perks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
  .perks div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.86rem;font-weight:600}
  .totbox{border:2px solid var(--honey);border-radius:14px;overflow:hidden;margin-top:12px}
  .totrow{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
  .totrow:first-child{border-top:0}
  .totrow.big{background:var(--soft);font-weight:850}
  .totrow .v{font-weight:850;color:var(--honey-deep);font-variant-numeric:tabular-nums}
  .totrow.mes .v{color:var(--good)}
  .nota{background:#fff8ec;border:1px solid var(--line);border-left:3px solid var(--honey);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:.92rem}
  .firma{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px}
  @media(max-width:520px){.firma{grid-template-columns:1fr}.perks{grid-template-columns:1fr}}
  .firma .f{border-top:1.5px solid var(--ink);padding-top:6px;font-size:.82rem;color:var(--ink2)}
  .fine{color:var(--ink2);font-size:.78rem;margin-top:22px;text-align:center}
  .empty{max-width:620px;margin:40px auto;background:var(--paper);border:1px dashed var(--honey);border-radius:14px;padding:26px;text-align:center}
  @media print{
    .bar{display:none} body{background:#fff}
    .doc{box-shadow:none;border:0;margin:0;max-width:100%;border-radius:0}
    .item,.perks div{background:#fff}
  }
</style>

<div class="bar">
  <b>🍯 Panal · Propuesta</b>
  <div class="btns">
    <a class="btn btn-g" href="index.html">← Panal</a>
    <button class="btn btn-g" onclick="cargar()">🔄 Actualizar</button>
    <button class="btn btn-w" onclick="wapp()">💬 Enviar</button>
    <button class="btn btn-h" onclick="window.print()">📄 Descargar / Imprimir</button>
  </div>
</div>

<div id="root"></div>

<script>
(function(){
  var WA_PANAL="56928005332";
  // Ventajas por módulo (para redactar la propuesta)
  var BEN={
    produccion:"Fabricas por receta: el sistema descuenta los insumos solos y sabes tu costo y ganancia real.",
    ventas:"Vendes en ruta o local con distintos medios de pago; cada venta queda registrada.",
    repartos:"Los pedidos caen en una bandeja central y el despacho sale ordenado a su destino.",
    inventario:"Controlas productos e insumos con alerta antes de que falte algo.",
    clientes:"Ficha, historial y cuenta corriente al día de cada cliente; nada se olvida.",
    panel:"Todo llega y se guarda aquí; recibes el reporte diario y las prioridades del día.",
    facturacion:"Notas, guías y folios ordenados, con recordatorio de qué falta facturar.",
    recetas:"Recetas con costo automático y capacitación para el personal nuevo, sin perder el secreto.",
    agenda:"Tus clientes reservan online, pagan la seña y reciben recordatorios (menos ausencias).",
    mejoras:"Dictas los pendientes, les pones fecha y se van tachando — nada se queda en el aire.",
    tienda:"Tus clientes piden solos desde la web con su precio, y cada uno tiene su portal 'Mi Cuenta'.",
    distribucion:"Todos tus proveedores, compras y estudio de costos en un solo lugar para negociar mejor.",
    socio:"Tu socio virtual: dashboards, rentabilidad y balances por negocio, sin que se mezclen."
  };
  var PERKS=[
    ["🎤","Todo por voz — hablas y queda hecho"],
    ["📱","Solo un teléfono o tablet"],
    ["🗂️","Todo queda registrado, sin papeles sueltos"],
    ["🔄","Mejoras incluidas cada mes"]
  ];
  var clp=function(n){ return "$"+Number(n||0).toLocaleString('es-CL'); };
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };

  function leer(){
    try{ var st=JSON.parse(localStorage.getItem("panal-config-v1")); return st&&st.resumen? st.resumen : null; }catch(e){ return null; }
  }

  window.cargar=function(){
    var r=leer(); var root=document.getElementById('root');
    if(!r || ((r.mods||[]).length===0 && (r.serv||[]).length===0)){
      root.innerHTML='<div class="empty"><h1>Aún no hay nada que cotizar</h1><p class="meta">Abre el <b>Configurador</b>, arma el plan del cliente (módulos, precios y plan de soporte) y vuelve aquí: la propuesta se redacta sola.</p><p style="margin-top:14px"><a class="btn btn-h" href="configurador.html">🧩 Ir al Configurador</a></p></div>';
      return;
    }
    var neg = r.negocio || "el cliente";
    var mesTot = (r.mensual||0);
    var h='';
    h+='<div class="doc">';
    h+='<span class="eyebrow">Propuesta de servicio</span>';
    h+='<h1>'+esc(neg)+'</h1>';
    h+='<div class="meta">'+[r.ciudad,r.fecha].filter(Boolean).map(esc).join(' · ')+'</div>';
    h+='<p class="lead">Este es el sistema que dejaremos funcionando para <b>'+esc(neg)+'</b>: cada parte conectada, en el celular, y todo bajo control.</p>';
    // perks
    h+='<div class="perks">'+PERKS.map(function(p){return '<div>'+p[0]+' '+p[1]+'</div>';}).join('')+'</div>';

    // Módulos
    if((r.mods||[]).length){
      h+='<h2>Lo que incluye</h2>';
      r.mods.forEach(function(m){
        h+='<div class="item"><div class="t"><h3>'+esc(m.nombre)+'</h3><span class="pr">'+(m.sub?clp(m.sub):'')+'</span></div>';
        if(BEN[m.key]) h+='<p class="ben">'+esc(BEN[m.key])+'</p>';
        var its=(m.items||[]).map(function(i){return esc(i.n.replace(/^[^ ]+ /,''));}).join(' · ');
        if(its) h+='<p class="cas">Incluye: '+its+'</p>';
        h+='</div>';
      });
    }
    // Extensiones
    if((r.exts||[]).length){
      h+='<h2>Extensiones</h2>';
      r.exts.forEach(function(x){ h+='<div class="item"><div class="t"><h3>'+esc(x.nombre)+'</h3><span class="pr">'+(x.p?clp(x.p):'')+'</span></div></div>'; });
    }
    // Servicios
    if((r.serv||[]).length){
      h+='<h2>Servicios adicionales '+(r.svcEnPlan?'(incluidos en el plan)':'')+'</h2>';
      r.serv.forEach(function(s){ h+='<div class="item"><div class="t"><h3>'+esc(s.n)+'</h3><span class="pr">'+(s.p?clp(s.p):'')+'</span></div></div>'; });
    }

    // Inversión
    h+='<h2>Inversión</h2><div class="totbox">';
    h+='<div class="totrow"><span>Montaje (una vez)</span><span class="v">'+clp(r.montaje)+'</span></div>';
    h+='<div class="totrow mes"><span>Plan '+esc(r.planLabel||'')+' — '+esc(r.planDesc||'')+'</span><span class="v">'+(mesTot?clp(mesTot)+' /mes':'a definir')+'</span></div>';
    h+='<div class="totrow big"><span>Primer pago (montaje + 1 mes)</span><span class="v">'+clp((r.montaje||0)+mesTot)+'</span></div>';
    h+='</div>';
    h+='<p class="meta" style="margin-top:8px">El dominio corre por cuenta del cliente (~$12.000/año). La mensualidad incluye hosting, mantención, mejoras y soporte.</p>';

    if(r.notas) h+='<div class="nota"><b>Requerimientos especiales:</b><br>'+esc(r.notas)+'</div>';

    // Firma
    h+='<h2>Aceptación</h2>';
    h+='<p class="meta">Firmando este documento, el cliente acepta el servicio y los valores descritos para dar inicio a la instalación.</p>';
    h+='<div class="firma"><div class="f">Firma del cliente<br><br><br>Nombre / RUT: ____________________<br>Fecha: ____________</div>';
    h+='<div class="f">Panal — Javier<br><br><br>WhatsApp: +56 9 2800 5332<br>Fecha: ____________</div></div>';
    h+='<p class="fine">Panal · Sistema de gestión — propuesta válida por 15 días. Valores en pesos chilenos.</p>';
    h+='</div>';
    root.innerHTML=h;
    root.dataset.wa = r.wa || '';
    root.dataset.neg = neg;
    root.dataset.montaje = (r.montaje||0);
    root.dataset.mes = mesTot;
    root.dataset.plan = r.planLabel||'';
  };

  window.wapp=function(){
    var root=document.getElementById('root');
    var neg=root.dataset.neg||'tu negocio';
    var msg="Hola! Te dejo la propuesta de Panal para "+neg+": montaje "+clp(root.dataset.montaje)+" + plan "+(root.dataset.plan||'')+" "+clp(root.dataset.mes)+"/mes. Cualquier duda me dices y coordinamos. 🐝";
    var num=(root.dataset.wa||'').replace(/\D/g,'');
    window.open("https://wa.me/"+num+"?text="+encodeURIComponent(msg), "_blank");
  };

  cargar();
})();
</script>
</body></html>
