# Ecosistema local Benechito (a lo Imperio Digital):
# Postgres + Redis + n8n (automatización) + Evolution API (WhatsApp).
#
#   docker compose up -d
#
# Servicios:
#   - App Next.js (fuera de compose, con `npm run dev`) -> Postgres :5432
#   - n8n           http://localhost:5678
#   - Evolution API http://localhost:8080
#
# En el VPS con EasyPanel se replican estos mismos servicios.

services:
  postgres:
    image: postgres:16-alpine
    container_name: benechito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: benechito
      POSTGRES_PASSWORD: benechito
      POSTGRES_DB: benechito
    ports:
      - "5432:5432"
    volumes:
      - benechito_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: benechito-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n:latest
    container_name: benechito-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Santiago
      - TZ=America/Santiago
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENCRYPTION_KEY=benechito-n8n-key-cambiar
    volumes:
      - benechito_n8n:/home/node/.n8n

  evolution:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: benechito-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=benechito-evo-key-2026
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1043857760
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://benechito:benechito@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
    volumes:
      - benechito_evolution:/evolution/instances

volumes:
  benechito_pgdata:
  benechito_n8n:
  benechito_evolution:
